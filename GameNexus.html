<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameNexus 游境枢纽 | 全品类游戏站点</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #0f1117;
            color: #eee;
        }
        /* 导航栏 */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 80px;
            background-color: #161a23;
            border-bottom: 1px solid #272c38;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #42a5f5;
        }
        .logo span {
            color: #fff;
            font-size: 18px;
            margin-left: 8px;
        }
        .nav-menu a {
            color: #ccc;
            text-decoration: none;
            margin-left: 32px;
            font-size: 16px;
        }
        .nav-menu a:hover {
            color: #42a5f5;
        }
        
        /* 首屏横幅 - 已加入在线占位图 */
        .banner {
            height: 420px;
            background: linear-gradient(rgba(15, 17, 23, 0.6), rgba(15, 17, 23, 0.9)), url("https://picsum.photos/1920/600") no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 80px;
        }
        .banner h1 {
            font-size: 48px;
            margin-bottom: 16px;
            color: #42a5f5;
        }
        .banner p {
            font-size: 20px;
            color: #b0b8c4;
            max-width: 700px;
        }
         /* 游戏卡片区域 */
        .container {
            padding: 60px 80px;
        }
        .section-title {
            font-size: 26px;
            margin-bottom: 32px;
            border-left: 5px solid #42a5f5;
            padding-left: 12px;
        }
        .game-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }
        .game-card {
            background: #161a23;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #272c38;
            transition: 0.3s;
        }
        .game-card:hover {
            border-color: #42a5f5;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(66, 165, 245, 0.15); /* 加了一点悬浮发光效果 */
        }
        /* 新增卡片图片样式 */
        .game-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
            border-bottom: 1px solid #272c38;
        }
        .card-body {
            padding: 20px;
        }
        .card-body h3 {
            margin-bottom: 10px;
        }
        .card-body p {
            color: #9ca3af;
            font-size: 14px;
        }
        
        /* 页脚 */
        footer {
            padding: 30px 80px;
            background: #161a23;
            text-align: center;
            color: #888;
            margin-top: 40px;
            border-top: 1px solid #272c38;
        }
        @media (max-width: 768px) {
            nav {
                padding: 15px 20px;
                flex-direction: column;
                gap: 15px;
            }
            .nav-menu a {
                margin: 0 10px;
                font-size: 14px;
            }
            .banner {
                height: 350px;
                padding: 0 20px;
                text-align: center; /* 手机端文字居中更好看 */
                align-items: center;
            }
            .banner h1 {
                font-size: 32px;
            }
            .banner p {
                font-size: 16px;
            }
            .container {
                padding: 40px 20px;
            }
            .game-list {
                grid-template-columns: 1fr;             }
            footer {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav>
        <div class="logo">GameNexus <span>游境枢纽</span></div>
        <div class="nav-menu">
            <a href="#">首页</a>
            <a href="#">全部游戏</a>
            <a href="#">策略游戏</a>
            <a href="#">开放世界</a>
            <a href="#">独立游戏</a>
        </div>
    </nav>

    <!-- 首屏横幅 -->
    <div class="banner">
        <h1>汇聚世间所有游戏</h1>
        <p>GameNexus游境枢纽，收录策略、3A大作、开放世界、独立小品，属于全体玩家的游戏交汇之地。</p>
    </div>

    <!-- 游戏卡片区域 -->
    <div class="container">
        <h2 class="section-title">热门游戏</h2>
        <div class="game-list">
            <div class="game-card">
                <img src="https://picsum.photos/400/200?random=1" alt="全面战争：三国">
                <div class="card-body">
                    <h3>全面战争：三国</h3>
                    <p>历史策略大作，纵横乱世沙场</p>
                </div>
            </div>
            <div class="game-card">
                <img src="https://picsum.photos/400/200?random=2" alt="三国志14">
                <div class="card-body">
                    <h3>三国志14</h3>
                    <p>经典三国回合制策略游戏</p>
                </div>
            </div>
            <div class="game-card">
                <img src="https://picsum.photos/400/200?random=3" alt="幻兽帕鲁">
                <div class="card-body">
                    <h3>幻兽帕鲁</h3>
                    <p>开放世界怪物建造冒险</p>
                </div>
            </div>
            <div class="game-card">
                <img src="https://picsum.photos/400/200?random=4" alt="刺客信条">
                <div class="card-body">
                    <h3>刺客信条</h3>
                    <p>跨时代开放世界冒险系列</p>
                </div>
            </div>
            <div class="game-card">
                <img src="https://picsum.photos/400/200?random=5" alt="十字军之王3">
                <div class="card-body">
                    <h3>十字军之王3</h3>
                    <p>深度中世纪家族策略模拟</p>
                </div>
            </div>
            <div class="game-card">
                <img src="https://picsum.photos/400/200?random=6" alt="上古卷轴5">
                <div class="card-body">
                    <h3>上古卷轴5</h3>
                    <p>经典奇幻开放世界RPG</p>
                </div>
            </div>
        </div>
    </div>
    <footer>
        <p>© 2026 GameNexus 游境枢纽 | Web前端课程作业</p>
    </footer>
</body>
</html>
